<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 · Miguel Vilchis</title>
    <style>
      :root { --bg: #FFF4EA; --fg: #07162B; --accent: #B84A00; --muted: #4a5568; }
      @media (prefers-color-scheme: dark) { :root { --bg: #07162B; --fg: #FFF4EA; --accent: #FF8A3D; --muted: #b8c0cc; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 32rem; }
      .code { font: 500 0.8rem ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.24em; color: var(--accent); }
      h1 { margin: 0.4rem 0 0.8rem; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; letter-spacing: -0.02em; }
      p { margin: 0 0 1rem; color: var(--muted); }
      a { display: inline-block; margin-top: 0.6rem; padding: 0.7rem 1.2rem; border-radius: 0.5rem; background: var(--accent); color: var(--bg); font-weight: 500; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); margin: 1.6rem 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>That page does not exist. The portfolio is a single page.</p>
      <a href="/">Back to the portfolio</a>
      <hr />
      <h1 lang="es" style="font-size:1.4rem">Página no encontrada</h1>
      <p lang="es">Esa página no existe. El portafolio es de una sola página. <a href="/?lang=es" style="margin:0;padding:0;background:none;color:var(--accent);text-decoration:underline">Volver al portafolio</a></p>
    </main>
  </body>
</html>
