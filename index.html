    <!-- Light and dark, following the visitor's system. Light is the fallback. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF4EA" />
    <script>
      // Applies a saved theme choice before first paint, so there is no flash
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#07162B' : '#FFF4EA');
      } catch (e) {}
    </script>
