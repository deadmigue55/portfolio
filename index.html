    <!-- Light and dark, following the visitor's system. Light is the fallback. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF4EA" />
    <script>
      // Applies the saved theme, motion and language choices before first paint, so there is no flash
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#07162B' : '#FFF4EA');
      } catch (e) {}
      try {
        var root = document.documentElement;
        var calm = localStorage.getItem('motion') === 'paused' || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        root.setAttribute('data-motion', calm ? 'reduced' : 'full');
        var q = new URLSearchParams(location.search).get('lang');
        var l = q === 'en' || q === 'es' ? q : localStorage.getItem('lang');
        if (l === 'es') root.lang = 'es';
      } catch (e) {}
    </script>
